name = "nyc-properties-hub"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# NOTE: For Cloudflare Pages, configure these bindings via the Cloudflare Dashboard,
# NOT in this file (wrangler.toml bindings cause "Invalid database UUID" errors on Pages):
#
#   Settings → Functions → D1 database bindings:
#     Variable name: DB    → Database: properties-hub
#
#   Settings → Functions → R2 bucket bindings:
#     Variable name: FILES → Bucket: properties-hub-files
#
#   Settings → Environment variables (Production):
#     FILES_PUBLIC_BASE = https://pub-XXXXXXXX.r2.dev   (or your R2 custom domain)
#
# For local dev only (`npm run dev`), bindings are passed via CLI flags in package.json.
